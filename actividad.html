<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="actividad.css">
    <title>Actividad física</title>
</head>
<body>
    <script>
    function registrarActividad() {
    let actividad = document.getElementById("actividad").value;
    let duracion = document.getElementById("duracion").value;

    if (actividad && duracion) {

        let fecha = new Date().toLocaleDateString();

        let listaActividades =
            document.getElementById("listaActividades");

        let nuevaActividad =
            document.createElement("li");
        nuevaActividad.textContent = fecha + " - " +  actividad + " - " + duracion + " minutos";
         listaActividades.appendChild(nuevaActividad);

        document.getElementById("actividad").value = "";
        document.getElementById("duracion").value = "";

    } else {
        alert("Por favor, complete ambos campos.");
    }
}
    </script>
    <div class="container">
        <form>
            <h2>Registro de Actividad Física</h2>
            <label for="actividad">Tipo de actividad:</label>
            <input type="text" id="actividad" placeholder="Ej: Caminata, Correr, Etc." required>
            <label for="duracion">Duración (minutos):</label>
            <input type="number" id="duracion" placeholder="Ej: 30" required>   
            <h3>Historial de Actividades</h3>
            <ul id="listaActividades"></ul>
            <button type="button" class="btn btn-primary" onclick="registrarActividad()">Registrar Actividad</button>
        </form>
    </div>
    <div class="imagen">
        <img src="./images.png" alt="Imagen de actividad física" class="img-fluid">        
</body>
</html>
