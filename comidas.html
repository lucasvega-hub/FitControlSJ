<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="comidas.css">
    <title>Document</title>
</head>
<body>
    <script>
        function guardarComida(){
                let comida = document.getElementById("comida").value;
                    if(comida){
                          let listaComidas = document.getElementById("listaComidas");
                          let nuevaComida = document.createElement("li");   
                          let fechaActual = new Date().toLocaleDateString();
                                nuevaComida.textContent = fechaActual + " - " + comida;
                               listaComidas.appendChild(nuevaComida);
                         document.getElementById("comida").value = "";
                         } else {
                            alert("Por favor, ingrese una comida válida.");}
                         }
    </script>
     <div class="container">
        <h1>Control de Comidas</h1>

    <label for="comida">Ingrese la comida:</label>
    <input type="text" id="comida" placeholder="Ej: Manzana">

    <button onclick="guardarComida()"> Registrar Comida </button>

    <h2>Historial de Comidas</h2>

    <ul id="listaComidas"></ul>

    </div>
    <div class="imagen">
        <img src="./images (1).jpg" alt="Imagen de comida saludable" class="img-fluid">
</body>
</html>
